name: Dependency watch

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same Node version as ci.yml.
  NODE_VERSION: 24

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # A failing run is the signal; this workflow opens no issues or PRs.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
