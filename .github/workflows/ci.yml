name: CI

on:
  pull_request:
    # Draft PRs skip CI to save Actions minutes; marking one ready runs it.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# A newer push to a pull request makes its in-flight run obsolete, so PR runs share a group
# per branch. Pushes to the default branch get a group per commit and always finish, since
# deploy only ships a commit whose CI passed.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  # Matches the Node image in the Dockerfile, so CI tests what production runs.
  NODE_VERSION: 24

jobs:
  checks:
    name: Checks
    if: github.event.pull_request.draft != true
    outputs:
      image: ${{ steps.image-inputs.outputs.image }}
    # Pin the image so OS upgrades are deliberate and testable.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Actions minutes: a pull request builds the production image only when it changes
      # one of the image's inputs below. Code changes are already built and tested by the
      # other jobs, and pushes to the default branch always build the image, which deploys
      # wait for. If the PR's file list can't be read, it builds.
      - name: Does this change need the image build?
        id: image-inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          NEEDS: '^(Dockerfile|\.dockerignore|package(-lock)?\.json|tsconfig\.json|\.github/workflows/ci\.yml)$'
        run: |
          image=true
          if [ -n "$PR" ] && files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename'); then
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qE "$NEEDS"; then image=false; fi
          fi
          echo "image=$image" >>"$GITHUB_OUTPUT"
          echo "Production image build: $image"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  image:
    name: Production image
    needs: checks
    if: github.event.pull_request.draft != true && needs.checks.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      # The Dockerfile copies the compiled build/ folder, the same way npm run deploy
      # builds before fly deploy, so compile first.
      - name: Build
        run: npm run build

      - name: Build the production image
        run: docker build -t oura-mcp:ci .
